spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servitec_test}
    username: ${SPRING_DATASOURCE_USERNAME:servitec}
    password: ${SPRING_DATASOURCE_PASSWORD:servitec}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: ${SPRING_FLYWAY_LOCATIONS:filesystem:../../db/migrations}

app:
  security:
    jwt-secret: ${JWT_SECRET:test-secret-test-secret-test-secret-test-secret}
    jwt-expiration-minutes: 120
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}