spring:
  application:
    name: servitec-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servitec}
    username: ${SPRING_DATASOURCE_USERNAME:servitec}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: ${SPRING_FLYWAY_LOCATIONS:filesystem:../../db/migrations}

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: 120
  cors:
    # Orígenes de los fronts, separados por comas (default: Vite 5173 y 5174).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

server:
  # Puerto de la API: se define por entorno para no tener puertos literales en el código.
  port: ${SERVER_PORT:8080}